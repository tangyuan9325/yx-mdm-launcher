name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build-apk:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0" "platforms;android-36"

      - name: Decode Keystore
        run: |
          $base64 = Get-Content "tools\yx-release.keystore.b64" -Raw
          [System.IO.File]::WriteAllBytes("tools\yx-release.keystore", [System.Convert]::FromBase64String($base64))

      - name: Decode Binary Resources
        run: |
          $files = Get-ChildItem "res-binary" -Filter "*.b64"
          foreach ($f in $files) {
            # 文件名格式: app_src_main_res_<type>_<filename>.png.b64
            # 去掉 .b64 后缀和 app_src_main_res_ 前缀
            $name = $f.BaseName
            $prefix = "app_src_main_res_"
            if ($name.StartsWith($prefix)) {
              $remainder = $name.Substring($prefix.Length)
              # 第一个下划线之前是资源类型目录，之后是文件名(保留下划线)
              $idx = $remainder.IndexOf('_')
              if ($idx -gt 0) {
                $resType = $remainder.Substring(0, $idx)
                $fileName = $remainder.Substring($idx + 1)
                $relPath = "app/src/main/res/$resType/$fileName"
              } else {
                $relPath = "app/src/main/res/$remainder"
              }
            } else {
              $relPath = $name -replace '_', '/'
            }
            $fullPath = Join-Path $PWD $relPath
            $dir = Split-Path $fullPath -Parent
            if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
            $base64 = Get-Content $f.FullName -Raw
            [System.IO.File]::WriteAllBytes($fullPath, [System.Convert]::FromBase64String($base64))
            Write-Host "  Decoded: $relPath"
          }

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yx-mdm-launcher-apk
          path: output/yx-mdm-launcher.apk

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/yx-mdm-launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
